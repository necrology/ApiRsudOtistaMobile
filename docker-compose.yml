services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: otista-api:latest
    container_name: otista-api
    restart: unless-stopped
    environment:
      APP_NAME: ApiRsudOtistaMobile
      APP_ENV: production
      APP_PORT: 8080
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
